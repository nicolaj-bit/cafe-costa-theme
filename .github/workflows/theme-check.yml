# Tjekker temaet med Shopifys Theme Check ved hvert push.
# Fejler kun ved rigtige fejl (ikke advarsler i Dawns egne filer).
# Erstatter Dawns egne arbejdsgange (Lighthouse, CLA m.fl.), som kræver
# Shopifys interne adgangskoder og derfor altid fejlede her.
name: Theme Check
on: [push, pull_request]
jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Theme Check
        run: npx --yes @shopify/cli@3 theme check --path . --fail-level error
